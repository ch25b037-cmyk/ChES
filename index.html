<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A personal profile card for Gokkul Nath, a web devoloper.">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Gokkul Nath | web devoloper</title>
</head>
<body>
    <main class="page-shell">

        <article class="profile-card">
            <div class="card-topline">
                <span class="availability"><span class="status-dot"></span> Available for Recruitment</span>
                <span class="card-mark" aria-hidden="true">✦</span>
            </div>

            <div class="profile-intro">
                <div class="intro-copy">
                    <p class="greeting">Hello, I'm</p>
                    <h1>Gokkul<br><span>Nath</span></h1>
                    <p class="role">Web Devoloper <span></p>
                </div>
            </div>

            <div class="card-body">
                <p class="description">I turn complex ideas into simple, thoughtful experiences that feel as good as they work.</p>
                <div class="details">
                    <span>Tuticorin, Tamil Nadu</span>
                    <span>0+ years experience</span>
                </div>
                <a class="contact-button" href="abc@xyz.com">
                    <span>Let's work together</span>
                </a>
            </div>

            <div class="card-footer">
                <span class="footer-label">Find me on</span>
                <div class="social-links">
                    <a href="https://www.linkedin.com" aria-label="LinkedIn">in</a>
                    <a href="https://www.instagram.com" aria-label="Instagram">ig</a>
                </div>
            </div>
        </article>
    </main>
</body>
</html>
